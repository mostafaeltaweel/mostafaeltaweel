<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <!-- Subtle Teal & Mint Glows -->
    <radialGradient id="tealGlow" cx="80%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mintGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients for Lines -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#5EEAD4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.2" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="300" fill="url(#bgGradient)" />
  <rect width="900" height="300" fill="url(#grid)" />
  <rect width="900" height="300" fill="url(#tealGlow)" />
  <rect width="900" height="300" fill="url(#mintGlow)" />

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="898" height="298" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Abstract Data Flow Lines & Nodes (Visualising Systems & Analytics) -->
  <g opacity="0.65">
    <!-- Top Flow Path -->
    <path d="M 40 50 Q 220 30 450 70 T 860 40" fill="none" stroke="url(#lineGrad1)" stroke-width="1.2" />
    <circle cx="220" cy="38" r="3" fill="#5EEAD4" />
    <circle cx="450" cy="70" r="4" fill="#0D9488" />
    <circle cx="680" cy="52" r="3" fill="#5EEAD4" />

    <!-- Bottom Flow Path -->
    <path d="M 40 250 Q 260 270 520 235 T 860 260" fill="none" stroke="url(#lineGrad1)" stroke-width="1.2" />
    <circle cx="260" cy="265" r="3.5" fill="#0D9488" />
    <circle cx="520" cy="235" r="4" fill="#5EEAD4" />
    <circle cx="740" cy="250" r="3" fill="#0D9488" />

    <!-- Geometric Network Accent at Right -->
    <polygon points="810,120 850,150 810,180 770,150" fill="none" stroke="#334155" stroke-width="1" />
    <line x1="810" y1="120" x2="810" y2="180" stroke="#0D9488" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="770" y1="150" x2="850" y2="150" stroke="#0D9488" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="810" cy="150" r="3" fill="#5EEAD4" />

    <!-- Left Geometric Data Node -->
    <polygon points="90,130 120,150 90,170 60,150" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="90" cy="150" r="3" fill="#0D9488" />
  </g>

  <!-- Central Content Hierarchy -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Tag -->
    <rect x="330" y="38" width="240" height="26" rx="13" fill="#172033" stroke="#334155" stroke-width="1" />
    <circle cx="346" cy="51" r="3.5" fill="#5EEAD4" />
    <text x="454" y="56" font-size="11" font-weight="600" fill="#CBD5E1" letter-spacing="1">TECHNOLOGY PORTFOLIO</text>

    <!-- Primary Name -->
    <text x="450" y="112" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
      MOSTAFA ELTAWEEL
    </text>

    <!-- Professional Positioning Headline -->
    <text x="450" y="146" font-size="15" font-weight="600" fill="#5EEAD4" letter-spacing="0.04em">
      Applied AI &amp; Workflow Automation | Data Analytics &amp; BI | ERP Systems
    </text>

    <!-- Core Value Proposition -->
    <text x="450" y="180" font-size="13" font-weight="400" fill="#CBD5E1" opacity="0.9">
      Building practical technology solutions by combining data analytics, applied AI, workflow automation, and business systems.
    </text>

    <!-- Architecture Capability Chips -->
    <g transform="translate(140, 215)">
      <!-- Chip 1: RAG & Agents -->
      <g transform="translate(0, 0)">
        <rect width="140" height="30" rx="15" fill="#172033" stroke="url(#badgeBorder)" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#5EEAD4" />
        <text x="78" y="19" font-size="11.5" font-weight="500" fill="#E2E8F0">RAG &amp; LLM APIs</text>
      </g>

      <!-- Chip 2: Power BI PL-300 -->
      <g transform="translate(155, 0)">
        <rect width="155" height="30" rx="15" fill="#172033" stroke="url(#badgeBorder)" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#5EEAD4" />
        <text x="85" y="19" font-size="11.5" font-weight="500" fill="#E2E8F0">Power BI (PL-300)</text>
      </g>

      <!-- Chip 3: SQL & Python -->
      <g transform="translate(325, 0)">
        <rect width="145" height="30" rx="15" fill="#172033" stroke="url(#badgeBorder)" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#5EEAD4" />
        <text x="80" y="19" font-size="11.5" font-weight="500" fill="#E2E8F0">SQL Server &amp; Python</text>
      </g>

      <!-- Chip 4: ERP & n8n -->
      <g transform="translate(485, 0)">
        <rect width="135" height="30" rx="15" fill="#172033" stroke="url(#badgeBorder)" stroke-width="1" />
        <circle cx="16" cy="15" r="3" fill="#5EEAD4" />
        <text x="75" y="19" font-size="11.5" font-weight="500" fill="#E2E8F0">ERP &amp; n8n Flows</text>
      </g>
    </g>
  </g>
</svg>